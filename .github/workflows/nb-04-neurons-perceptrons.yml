name: "NB 04 · Biological Neurons, McCulloch–Pitts Neurons and Perceptrons"

# Manually triggered: Actions tab -> this workflow -> "Run workflow".
# Executes notebooks/04-neurons-perceptrons/04_neurons_perceptrons.ipynb
# on a free GitHub runner, records every output and log, and commits them back into the notebook folder.
on:
  workflow_dispatch:
    inputs:
      commit_results:
        description: "Commit executed notebook, HTML, log and figures back to the repo"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: nb-04
  cancel-in-progress: false

jobs:
  run:
    uses: ./.github/workflows/_run-notebook.yml
    with:
      notebook: notebooks/04-neurons-perceptrons/04_neurons_perceptrons.ipynb
      commit_results: ${{ inputs.commit_results }}
      timeout_minutes: 30

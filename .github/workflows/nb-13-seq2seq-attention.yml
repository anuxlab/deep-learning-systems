name: "NB 13 · Sequence-to-Sequence Learning and Attention Mechanisms"

# Manually triggered: Actions tab -> this workflow -> "Run workflow".
# Executes notebooks/13-seq2seq-attention/13_seq2seq_attention.ipynb
# on a free GitHub runner, records every output and log, and commits them back into the notebook folder.
on:
  workflow_dispatch:
    inputs:
      commit_results:
        description: "Commit executed notebook, HTML, log and figures back to the repo"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: nb-13
  cancel-in-progress: false

jobs:
  run:
    uses: ./.github/workflows/_run-notebook.yml
    with:
      notebook: notebooks/13-seq2seq-attention/13_seq2seq_attention.ipynb
      commit_results: ${{ inputs.commit_results }}
      timeout_minutes: 45

name: "NB 06 · Loss Functions, Gradient Descent and Empirical Risk Minimization"

# Manually triggered: Actions tab -> this workflow -> "Run workflow".
# Executes notebooks/06-losses-gradient-descent/06_losses_gradient_descent.ipynb
# on a free GitHub runner, records every output and log, and commits them back into the notebook folder.
on:
  workflow_dispatch:
    inputs:
      commit_results:
        description: "Commit executed notebook, HTML, log and figures back to the repo"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: nb-06
  cancel-in-progress: false

jobs:
  run:
    uses: ./.github/workflows/_run-notebook.yml
    with:
      notebook: notebooks/06-losses-gradient-descent/06_losses_gradient_descent.ipynb
      commit_results: ${{ inputs.commit_results }}
      timeout_minutes: 30

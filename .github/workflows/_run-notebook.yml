# Reusable workflow: execute ONE notebook on a free GitHub-hosted runner, keep every output,
# and (optionally) commit the results back into the notebook's own folder.
#
# Called by the per-notebook workflows nb-<id>-<slug>.yml (each one is manually triggered).
name: _run-notebook (reusable)

on:
  workflow_call:
    inputs:
      notebook:
        description: "Path to the .ipynb, e.g. notebooks/07-mlp-backprop/07_mlp_backprop.ipynb"
        required: true
        type: string
      commit_results:
        description: "Commit executed notebook, HTML, log and figures back to the repository"
        required: false
        type: boolean
        default: true
      timeout_minutes:
        description: "Job timeout"
        required: false
        type: number
        default: 45
      cell_timeout_seconds:
        description: "Per-cell timeout"
        required: false
        type: number
        default: 1800

permissions:
  contents: write          # needed only to push the results back

jobs:
  run:
    name: Execute ${{ inputs.notebook }}
    runs-on: ubuntu-latest          # free runner: 4 vCPU, 16 GB RAM, no GPU (public repos)
    timeout-minutes: ${{ inputs.timeout_minutes }}
    env:
      PYTHONUNBUFFERED: "1"
      MPLBACKEND: "module://matplotlib_inline.backend_inline"
      OMP_NUM_THREADS: "4"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies (CPU-only PyTorch)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          python - <<'PY'
          import torch, numpy, sklearn, scipy, matplotlib
          print("torch", torch.__version__, "| cuda:", torch.cuda.is_available(), "| numpy", numpy.__version__, "| sklearn", sklearn.__version__)
          PY

      - name: Resolve notebook folder
        id: paths
        run: echo "dir=$(dirname '${{ inputs.notebook }}')" >> "$GITHUB_OUTPUT"

      - name: Execute notebook (all outputs and logs are recorded)
        id: execute
        continue-on-error: true          # we still want to commit/upload partial results on failure
        run: |
          python scripts/run_notebook.py "${{ inputs.notebook }}" --timeout ${{ inputs.cell_timeout_seconds }}

      - name: Job summary
        if: always()
        run: python scripts/job_summary.py "${{ inputs.notebook }}" "${{ steps.execute.outcome }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results as a workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.paths.outputs.dir }}/
          if-no-files-found: warn
          retention-days: 30

      - name: Commit results back to the repository
        if: always() && inputs.commit_results
        run: |
          set -euo pipefail
          DIR="${{ steps.paths.outputs.dir }}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A "$DIR"
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "ci(notebooks): executed $(basename "${{ inputs.notebook }}") — outcome: ${{ steps.execute.outcome }} (run ${{ github.run_id }}) [skip ci]"
          # several notebook workflows may push concurrently: rebase and retry
          for attempt in 1 2 3 4 5; do
            git pull --rebase --autostash origin "${{ github.ref_name }}" && git push origin "HEAD:${{ github.ref_name }}" && exit 0
            echo "push attempt $attempt failed; retrying..."; sleep $((attempt * 5))
          done
          echo "::error::could not push results after 5 attempts"; exit 1

      - name: Fail the job if the notebook failed
        if: steps.execute.outcome == 'failure'
        run: |
          echo "::error::Notebook execution failed — see run.log (it was committed/uploaded for debugging)."
          exit 1

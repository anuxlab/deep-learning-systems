name: "NB 22 · Transfer Learning, Parameter-Efficient Fine-Tuning and Foundation Models"

# Manually triggered: Actions tab -> this workflow -> "Run workflow".
# Executes notebooks/22-transfer-foundation/22_transfer_foundation.ipynb
# on a free GitHub runner, records every output and log, and commits them back into the notebook folder.
on:
  workflow_dispatch:
    inputs:
      commit_results:
        description: "Commit executed notebook, HTML, log and figures back to the repo"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: nb-22
  cancel-in-progress: false

jobs:
  run:
    uses: ./.github/workflows/_run-notebook.yml
    with:
      notebook: notebooks/22-transfer-foundation/22_transfer_foundation.ipynb
      commit_results: ${{ inputs.commit_results }}
      timeout_minutes: 30

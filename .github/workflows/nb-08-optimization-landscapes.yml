name: "NB 08 · Deep Network Optimization and Loss Landscapes"

# Manually triggered: Actions tab -> this workflow -> "Run workflow".
# Executes notebooks/08-optimization-landscapes/08_optimization_landscapes.ipynb
# on a free GitHub runner, records every output and log, and commits them back into the notebook folder.
on:
  workflow_dispatch:
    inputs:
      commit_results:
        description: "Commit executed notebook, HTML, log and figures back to the repo"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: nb-08
  cancel-in-progress: false

jobs:
  run:
    uses: ./.github/workflows/_run-notebook.yml
    with:
      notebook: notebooks/08-optimization-landscapes/08_optimization_landscapes.ipynb
      commit_results: ${{ inputs.commit_results }}
      timeout_minutes: 30
